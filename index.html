<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireplace Ambiance | Coasters Tavern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-glow: rgba(255, 80, 0, 0.6);
            --fire-bright: #ff6a00;
            --fire-dark: #802000;
            --text: #f9fafb;
            --border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        #fire-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            transition: filter 0.5s ease, opacity 1s ease;
        }

        /* Ambient Glow Overlay */
        .ambient-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- On/Off Controls --- */
        .fire-controls {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            gap: 12px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0,0,0,0.4);
            padding: 1rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        body:hover .fire-controls { opacity: 1; }

        .fire-toggle {
            position: relative;
            width: 70px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .fire-toggle.active {
            background: rgba(255, 100, 0, 0.4);
            border-color: var(--fire-bright);
            box-shadow: 0 0 20px rgba(255, 80, 0, 0.3);
        }
        .fire-toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 28px;
            height: 28px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .fire-toggle.active::after {
            transform: translateX(34px);
            background: var(--fire-bright);
            box-shadow: 0 0 10px var(--fire-glow);
        }

        .fire-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,200,150,0.6);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .intensity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }
        .intensity-control input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            outline: none;
        }
        .intensity-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--fire-bright);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--fire-glow);
        }
        .intensity-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255,200,150,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Status Badge --- */
        .status-badge {
            position: fixed; top: 2rem; left: 2rem;
            color: rgba(255, 200, 150, 0.2);
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 4px;
            z-index: 50;
        }

        /* --- Nav Hub --- */
        .nav-hub { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); padding: 12px 20px; 
            display: flex; justify-content: center; align-items: center; gap: 20px; 
            z-index: 5000; transform: translateY(100%); transition: 0.3s;
            pointer-events: auto;
        }
        body:hover .nav-hub { transform: translateY(0); }
        .nav-link { 
            color: #888; text-decoration: none; font-size: 0.8rem; 
            font-weight: 700; text-transform: uppercase; 
            transition: color 0.2s;
        }
        .nav-link:hover { color: #ff6a00; }
        .nav-link.active { color: #ff6a00; }
        .nav-sep { color: #333; font-size: 0.6rem; }
    </style>
</head>
<body>
    <video id="fire-video" autoplay loop muted playsinline>
        <source src="fireplace.mp4" type="video/mp4">
    </video>

    <div class="ambient-glow"></div>

    <!-- On/Off Controls (hover to reveal) -->
    <div class="fire-controls">
        <span class="fire-label">Fireplace</span>
        <div class="fire-toggle active" id="fire-toggle" onclick="toggleFire()"></div>
        <div class="intensity-control">
            <span class="intensity-label">Brightness</span>
            <input type="range" min="20" max="150" value="100" id="fire-intensity" oninput="setIntensity(this.value)">
        </div>
    </div>

    <!-- Navigation Hub -->
    <nav class="nav-hub">
        <a href="../_ct-MATRIX/index.html" class="nav-link">📺 Display</a>
        <a href="../_ct-MATRIX/masteradmin.html" class="nav-link">🛠 Admin</a>
        <span class="nav-sep">|</span>
        <a href="../_ct-MOM/index.html" class="nav-link">🌸 MOM</a>
        <a href="../_ct-MMR/index.html" class="nav-link">🥩 MMR</a>
        <a href="../_ct-ACE/index.html" class="nav-link">🃏 ACE</a>
        <a href="../_ct-WEA/index.html" class="nav-link">🌦 WEA</a>
        <a href="index.html" class="nav-link active">🔥 FIR</a>
        <a href="../_ct-NIM/index.html" class="nav-link">🎨 NIM</a>
    </nav>

    <script>
        const video = document.getElementById('fire-video');
        const toggle = document.getElementById('fire-toggle');

        function toggleFire() {
            if (video.paused) {
                video.play();
                toggle.classList.add('active');
                video.style.opacity = '1';
            } else {
                video.pause();
                toggle.classList.remove('active');
                video.style.opacity = '0.2';
            }
        }

        function setIntensity(val) {
            // Apply brightness and contrast based on slider
            const brightness = val / 100;
            const contrast = 0.8 + (val / 500); // Subtle contrast adjustment
            video.style.filter = `brightness(${brightness}) contrast(${contrast})`;
        }

        // Initialize
        setIntensity(100);
    </script>
</body>
</html>
