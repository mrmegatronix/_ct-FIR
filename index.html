<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireplace Ambiance | Coasters Tavern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-glow: rgba(255, 80, 0, 0.6);
            --fire-bright: #ff6a00;
            --fire-dark: #802000;
            --text: #f9fafb;
            --border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        canvas {
            position: fixed; inset: 0;
            display: block;
            z-index: 1;
        }

        /* --- Visual Hierarchy --- */
        #slide-viewport {
            position: fixed; inset: 0;
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .slide {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; opacity: 0;
            transition: opacity 1.5s ease-in-out;
            padding: 5rem;
        }
        .slide.active { opacity: 1; }

        .premium-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6.5rem, 16vw, 15rem);
            font-weight: 900;
            line-height: 0.9;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: #fff;
            text-shadow: 
                0 0 20px rgba(255, 80, 0, 0.8),
                0 0 40px rgba(255, 40, 0, 0.4),
                0 10px 30px rgba(0,0,0,0.8);
            animation: flame-flicker 3s infinite alternate;
        }

        @keyframes flame-flicker {
            0% { text-shadow: 0 0 20px rgba(255, 80, 0, 0.8), 0 0 40px rgba(255, 40, 0, 0.4); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(255, 120, 0, 1), 0 0 60px rgba(255, 60, 0, 0.6); transform: scale(1.01); }
            100% { text-shadow: 0 0 25px rgba(255, 80, 0, 0.9), 0 0 50px rgba(255, 40, 0, 0.5); transform: scale(0.99); }
        }

        .premium-description {
            font-size: clamp(1.2rem, 2.5vw, 2.5rem);
            max-width: 1000px;
            font-weight: 600;
            opacity: 0.9;
            line-height: 1.4;
            color: #ffccaa;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* --- Progress Bar --- */
        .timer-bar {
            position: fixed; bottom: 0; left: 0; height: 14px;
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            box-shadow: 0 -5px 20px rgba(255, 69, 0, 0.5);
            z-index: 100; transition: width 0.1s linear;
        }

        .status-badge {
            position: fixed; top: 2rem; left: 2rem;
            color: rgba(255, 200, 150, 0.2);
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 4px;
            z-index: 50;
        }

        /* Nav Hub */
        .nav-hub { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); padding: 10px; 
            display: flex; justify-content: center; gap: 20px; 
            z-index: 5000; transform: translateY(100%); transition: 0.3s;
            pointer-events: auto;
        }
        body:hover .nav-hub { transform: translateY(0); }
        .nav-link { color: #888; text-decoration: none; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .nav-link:hover { color: #ff6a00; }
    </style>
</head>
<body>
    <canvas id="fireplace"></canvas>

    <nav class="nav-hub">
        <a href="index.html" class="nav-link">🔥 Fireplace</a>
        <a href="../_ct-MATRIX/index.html" class="nav-link">🏠 Matrix Hub</a>
        <a href="../_ct-MOM/index.html" class="nav-link">🌸 MOM</a>
        <a href="../_ct-MMR/index.html" class="nav-link">🥩 MMR</a>
    </nav>

    <script>
    (() => {
        const canvas = document.getElementById('fireplace');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /* ── Realistic Fire Engine ────────────────── */
        const rand = (min, max) => Math.random() * (max - min) + min;
        const flames = [];
        const MAX_FLAMES = 400;

        function spawnFlame() {
            const floorY = H * 0.92;
            const cx = W * 0.5;
            const fw = Math.min(W * 0.7, 1000);
            flames.push({
                x: cx + rand(-fw*0.5, fw*0.5),
                y: floorY,
                vx: rand(-0.2, 0.2),
                vy: rand(-3, -7),
                r: rand(20, 60),
                life: 1,
                decay: rand(0.003, 0.01),
                stretch: rand(1.5, 2.5) // Vertical stretching
            });
        }

        function loop() {
            // Dark smoky clearing
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0, 0, W, H);
            
            // Draw logs area (subtle)
            ctx.fillStyle = '#0a0502';
            ctx.fillRect(0, H * 0.9, W, H * 0.1);

            if (flames.length < MAX_FLAMES) {
                for(let i=0; i<4; i++) spawnFlame();
            }
            
            ctx.globalCompositeOperation = 'lighter';
            for (let i = flames.length - 1; i >= 0; i--) {
                const f = flames[i];
                f.x += f.vx;
                f.y += f.vy;
                f.life -= f.decay;
                f.r *= 0.99;
                
                if (f.life <= 0 || f.r < 1) { flames.splice(i, 1); continue; }

                const alpha = Math.pow(f.life, 2) * 0.5;
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
                
                let color;
                if (f.life > 0.7) color = `rgba(255, 220, 100, ${alpha})`;
                else if (f.life > 0.4) color = `rgba(255, 100, 20, ${alpha})`;
                else color = `rgba(180, 40, 0, ${alpha * 0.5})`;

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.scale(1, f.stretch);
                
                const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r);
                g.addColorStop(0, color);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, f.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(loop);
        }
        loop();
    })();
    </script>

</body>
</html>
