<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireplace Ambiance | Coasters Tavern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-glow: rgba(255, 80, 0, 0.6);
            --fire-bright: #ff6a00;
            --fire-dark: #802000;
            --text: #f9fafb;
            --border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        #fire-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            transition: filter 0.5s ease, opacity 1s ease;
        }

        /* Ambient Glow Overlay */
        .ambient-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* UI Controls Removed */

        /* Intensity Control Removed */

        /* Status Badge Removed */

        /* --- Nav Hub --- */
        /* Removed nav-hub to prevent display overlap */
        .nav-link { 
            color: #888; text-decoration: none; font-size: 0.8rem; 
            font-weight: 700; text-transform: uppercase; 
            transition: color 0.2s;
        }
        .nav-link:hover { color: #ff6a00; }
        .nav-link.active { color: #ff6a00; }
        .nav-sep { color: #333; font-size: 0.6rem; }
    </style>
</head>
<body>
    <video id="fire-video" autoplay loop muted playsinline>
        <source src="fireplace.mp4" type="video/mp4">
    </video>

    <div class="ambient-glow"></div>

    <!-- Controls Removed for clean loop -->


    <script>
        const video = document.getElementById('fire-video');

        // Ensure video plays and loops seamlessly
        window.onload = () => {
            video.play().catch(e => console.log('Autoplay blocked:', e));
        };

        window.addEventListener('keydown', (e) => {
            const activeTag = (document.activeElement?.tagName || '').toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select' || document.activeElement?.isContentEditable) return;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'SKIP_MODULE' }, '*');
                }
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                if (video) video.currentTime = 0;
            } else if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (video) {
                    if (video.paused) video.play().catch(() => {});
                    else video.pause();
                }
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                window.open('admin.html', '_blank');
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                window.open('remote.html', '_blank');
            }
        });

        window.addEventListener('message', (e) => {
            if (!e.data) return;
            if (e.data.type === 'SKIP_MODULE') {
                if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'SKIP_MODULE' }, '*');
            } else if (e.data.type === 'GOTO_FIRST') {
                if (video) video.currentTime = 0;
            }
        });
    </script>
</body>
</html>
